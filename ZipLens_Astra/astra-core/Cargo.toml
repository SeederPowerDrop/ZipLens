[package]
name = "ziplens-astra-core"
version = "2.0.0"
edition = "2021"
description = "Testable archive engine for ZipLens 2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.4.2", default-features = false, features = ["deflate-zlib-ng", "time", "aes-crypto"] }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-ng"] }
tar = "0.4.45"
zstd = { version = "0.13", features = ["zstdmt"] }
rayon = "1.8"
walkdir = "2.5"
tempfile = "3.26"
encoding_rs = "0.8"
unicode-normalization = "0.1"
filetime = "0.2"
libc = "0.2"
time = "0.3"
unalz = "=0.2.1"
unegg = "=0.2.1"

[profile.release]
debug = 1
